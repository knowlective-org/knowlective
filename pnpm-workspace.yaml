packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  # The CPU runtime is in the package; its postinstall only downloads the
  # CUDA (GPU) libraries, which semantic search doesn't use.
  onnxruntime-node: false
  # Only prints a version notice.
  protobufjs: false
  # Pulled in by next-intl for its message extraction, which isn't used; the
  # prebuilt binaries come as optional dependencies.
  '@parcel/watcher': false
  '@swc/core': false
overrides:
  # Prisma's config pins effect 3.20.0, which has a ReDoS (GHSA-7589-6fvf-x4pw,
  # fixed in 3.22.1). Remove once Prisma depends on a fixed version.
  effect@<3.22.1: ^3.22.1
patchedDependencies:
  '@blocknote/core@0.54.2': patches/@blocknote__core@0.54.2.patch
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS (no patched version yet). Reached only through
    # next-intl > @parcel/watcher, used by next-intl's message extraction,
    # which isn't turned on here; its glob patterns aren't user input either.
    # Remove once picomatch ships a fix.
    - GHSA-fc5q-39xc-vjpf
