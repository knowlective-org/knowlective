packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  # The CPU runtime is in the package; its postinstall only downloads the
  # CUDA (GPU) libraries, which semantic search doesn't use.
  onnxruntime-node: false
  # Only prints a version notice.
  protobufjs: false
  # Pulled in by next-intl for its message extraction, which isn't used; the
  # prebuilt binaries come as optional dependencies.
  '@parcel/watcher': false
  '@swc/core': false
