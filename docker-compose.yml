services:
  # PostgreSQL with transparent data encryption: Percona Server for
  # PostgreSQL + pg_tde (docker/postgres/). Tables, indexes and the WAL are
  # encrypted on disk with keys kept in a volume of their own
  # (postgres_tde_keys); the data volume alone can't be read.
  postgres:
    image: percona/percona-distribution-postgresql:17.11
    restart: unless-stopped
    # Root only to prepare the key directory; the image then runs as postgres.
    user: "0"
    entrypoint: ["bash", "/yosuga/tde-entrypoint.sh"]
    environment:
      POSTGRES_USER: yosuga
      POSTGRES_PASSWORD: yosuga
      POSTGRES_DB: yosuga
    ports:
      - "5432:5432"
    volumes:
      - postgres_tde_data:/data/db
      - postgres_tde_keys:/tde
      - ./docker/postgres/tde-entrypoint.sh:/yosuga/tde-entrypoint.sh:ro
      - ./docker/postgres/init-tde.sql:/docker-entrypoint-initdb.d/init-tde.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Bundled S3-compatible storage (SeaweedFS) for file attachments. Used by
  # default until another storage is configured in /admin. Only the S3 API is
  # published, on localhost. Credentials come from .env; the S3 identity file
  # is generated from them at startup.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:?set SEAWEEDFS_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:?set SEAWEEDFS_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/seaweedfs-s3.json <<JSON
        {"identities":[{"name":"yosuga","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024           -s3 -s3.port=8333 -s3.config=/etc/seaweedfs-s3.json
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
    volumes:
      - seaweedfs_data:/data

volumes:
  postgres_tde_data:
  # The encryption keys: back up apart from the data. Without them the
  # database can't be read.
  postgres_tde_keys:
  redis_data:
  seaweedfs_data:
